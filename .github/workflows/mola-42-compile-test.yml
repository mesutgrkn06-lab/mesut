name: Mola 4.2 separate Play listing build
on:
  push:
    paths:
      - '.github/workflows/mola-42-compile-test.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  compile-test:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      NO_GS: 'true'
    steps:
      - name: Fetch old source
        uses: actions/checkout@v4
        with:
          repository: moris545454/araba-
          ref: v4.1.10
      - name: Fetch decompiled 4.2 classes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/mola42"
          gh run download 42275314224 -R mesutgrkn06-lab/mesut -n mola-42-jadx-analysis -D "$RUNNER_TEMP/mola42"
      - name: Port Android Auto candidate classes into isolated working tree
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os
          root=Path(os.environ['RUNNER_TEMP'])/'mola42/analysis/sources/me/aap/fermata'
          names=['auto/CarNavigator.java','auto/CarAppsStore.java','auto/PhoneRotationGuard.java','auto/ParkedCar.java']
          for name in names:
              src=root/name
              assert src.is_file(), f'Missing: {src}'
              dest=Path('fermata/src/main/java/me/aap/fermata')/name
              dest.parent.mkdir(parents=True,exist_ok=True)
              assert not dest.exists(), f'Existing source must not be overwritten: {dest}'
              code=src.read_text(errors='replace')
              if name=='auto/CarAppsStore.java':
                  old='public static boolean isSelected(Context context, String str, String str2) {'
                  new='public static boolean isSelected(Context context, String str, String str2) throws org.json.JSONException {'
                  assert old in code, 'Expected JADX method signature not found'
                  code=code.replace(old,new,1)
              if name=='auto/ParkedCar.java':
                  print('PARKEDCAR SOURCE FOR REPAIR:')
                  for i,line in enumerate(code.splitlines()[:105],1):
                      print(f'{i:03}: {line}')
                  code=code.replace('import com.android.tools.r8.RecordTag;', '')
                  code=code.replace('class Spot extends RecordTag', 'class Spot')
                  code=code.replace('OpenOnCarToken$$ExternalSyntheticRecord0.m(this.time, this.accuracy, this.lat, this.lng)', 'java.util.Objects.hash(this.time, this.accuracy, this.lat, this.lng)')
                  code=code.replace('OpenOnCarToken$$ExternalSyntheticRecord0.m($record$getFieldsAsObjects(), Spot.class, "lat;lng;accuracy;time")', '"Spot[lat=" + this.lat + ", lng=" + this.lng + ", accuracy=" + this.accuracy + ", time=" + this.time + "]"')
                  assert 'OpenOnCarToken$$ExternalSyntheticRecord0' not in code
                  assert 'RecordTag' not in code
              dest.write_text(code)
              print('Added test class:',dest, 'bytes:',dest.stat().st_size)
          PY
      - name: Integrate rotation recovery into application startup
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('fermata/src/main/java/me/aap/fermata/FermataApplication.java')
          s=p.read_text()
          marker='\t\tsuper.onCreate();'
          assert s.count(marker)==1, 'Application lifecycle anchor changed'
          s=s.replace(marker, marker+'\n\t\tme.aap.fermata.auto.PhoneRotationGuard.recover(this);',1)
          p.write_text(s)
          print('Integrated PhoneRotationGuard.recover into FermataApplication.onCreate')
          PY
      - name: Integrate car apps state with dashboard lifecycle
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('fermata/src/main/java/me/aap/fermata/ui/fragment/DashboardFragment.java')
          s=p.read_text()
          # Ensure selected car apps are read during each dashboard rebuild.
          # No new cards are rendered yet; this is the data-layer integration.
          anchor='\t\tprivate void rebuildCards(@Nullable DashboardCard smartTopCard) {'
          assert s.count(anchor)==1
          replacement=anchor+'''
              if (activity.getRuntimeHostMode().usesAutomotivePresentation()) {
                  try {
                      me.aap.fermata.auto.CarAppsStore.getSelectedApps(ctx);
                  } catch (org.json.JSONException e) {
                      me.aap.utils.log.Log.e(e, "Failed to load selected car apps");
                  }
              }'''
          s=s.replace(anchor,replacement,1)
          p.write_text(s)
          print('Dashboard now reads selected car apps in automotive mode')
          PY
      - name: Add selected car app tiles and click handling
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root=Path('fermata/src/main/java/me/aap/fermata/ui/fragment')
          items=root/'DashboardItems.java'
          source=items.read_text()
          constructor='private Item(String name, @IdRes int id, @DrawableRes int icon, String title,'
          assert constructor in source
          source=source.replace(constructor,'Item(String name, @IdRes int id, @DrawableRes int icon, String title,',1)
          items.write_text(source)
          p=root/'DashboardModelBuilder.java'
          s=p.read_text()
          anchor='\t\tcards.add(DashboardCard.favoritesShelf(ctx));'
          assert s.count(anchor)==1
          insert='''\t\tif (automotive) {
              try {
                  for (me.aap.fermata.auto.CarAppsStore.AppItem app :
                          me.aap.fermata.auto.CarAppsStore.getSelectedApps(ctx)) {
                      cards.add(DashboardCard.item(new DashboardItems.Item(
                              "car_app:" + app.componentString(),
                              me.aap.utils.ui.UiUtils.ID_NULL,
                              R.drawable.web,
                              app.componentString(), "Araç uygulaması", null)));
                  }
              } catch (org.json.JSONException ignored) {
                  // Invalid stored app selection must not break the dashboard.
              }
          }
          '''
          s=s.replace(anchor,insert+anchor,1)
          p.write_text(s)
          p=root/'DashboardFragment.java'
          s=p.read_text()
          anchor='\t\t\t\tif (card.targetId == ID_NULL) return;'
          assert s.count(anchor)==1
          insert='''\t\t\t\tif ((card.item != null) && card.item.name.startsWith("car_app:")) {
                      String component = card.item.name.substring("car_app:".length());
                      android.content.ComponentName target =
                              android.content.ComponentName.unflattenFromString(component);
                      if (target != null) {
                          android.content.Intent intent = new android.content.Intent(
                                  android.content.Intent.ACTION_MAIN);
                          intent.addCategory(android.content.Intent.CATEGORY_LAUNCHER);
                          intent.setComponent(target);
                          intent.addFlags(android.content.Intent.FLAG_ACTIVITY_NEW_TASK);
                          try {
                              ctx.startActivity(intent);
                          } catch (android.content.ActivityNotFoundException |
                                  SecurityException ignored) {
                              // An unavailable or blocked external app must not crash Mola.
                          }
                      }
                      return;
                  }
          '''
          s=s.replace(anchor,insert+anchor,1)
          p.write_text(s)
          print('Added dashboard tiles and explicit component launches')
          PY
      - name: Configure JDK and Android SDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - name: Compile debug app with candidate
        run: bash gradlew :fermata:assembleAutoDebug :fermata:bundleAutoDebug -PAPP_ID=com.nexvory.mola42 --no-daemon --stacktrace
      - name: Check release signing credentials
        env:
          STORE_B64: ${{ secrets.MOLA42_KEYSTORE_BASE64 }}
          STORE_PASS: ${{ secrets.MOLA42_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.MOLA42_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.MOLA42_KEY_PASSWORD }}
        run: |
          if [[ -n "$STORE_B64" && -n "$STORE_PASS" && -n "$KEY_ALIAS" && -n "$KEY_PASS" ]]; then
            printf '%s' "$STORE_B64" | base64 --decode > "$RUNNER_TEMP/mola-upload.jks"
            echo "HAS_SIGNING=true" >> "$GITHUB_ENV"
            echo "Signing secrets present; release bundle will be built."
          else
            echo "HAS_SIGNING=false" >> "$GITHUB_ENV"
            echo "Release signing not configured; skipping signed AAB."
          fi
      - name: Prepare signed Play Console release
        if: ${{ env.HAS_SIGNING == 'true' }}
        run: |
          bash gradlew :fermata:bundleAutoRelease -PAPP_ID=com.nexvory.mola42 --no-daemon --stacktrace
        env:
          FERMATAX_STORE_FILE: ${{ runner.temp }}/mola-upload.jks
          FERMATAX_STORE_PASSWORD: ${{ secrets.MOLA42_STORE_PASSWORD }}
          FERMATAX_KEY_ALIAS: ${{ secrets.MOLA42_KEY_ALIAS }}
          FERMATAX_KEY_PASSWORD: ${{ secrets.MOLA42_KEY_PASSWORD }}
      - name: Save signed release AAB
        if: ${{ env.HAS_SIGNING == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: mola-play-console-signed-release-aab
          path: fermata/build/outputs/bundle/autoRelease/*.aab
          if-no-files-found: error
      - name: Save test APK
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: mola-42-apk-aab-debug-test
          path: |
            fermata/build/outputs/apk/auto/debug/*.apk
            fermata/build/outputs/bundle/autoDebug/*.aab
          if-no-files-found: warn
