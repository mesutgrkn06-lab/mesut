name: Mola 4.2 PhoneRotationGuard lifecycle integration
on:
  push:
    paths:
      - '.github/workflows/mola-42-compile-test.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  compile-test:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      NO_GS: 'true'
    steps:
      - name: Fetch old source
        uses: actions/checkout@v4
        with:
          repository: moris545454/araba-
          ref: v4.1.10
      - name: Fetch decompiled 4.2 classes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/mola42"
          gh run download 42275314224 -R mesutgrkn06-lab/mesut -n mola-42-jadx-analysis -D "$RUNNER_TEMP/mola42"
      - name: Port Android Auto candidate classes into isolated working tree
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os
          root=Path(os.environ['RUNNER_TEMP'])/'mola42/analysis/sources/me/aap/fermata'
          names=['auto/CarNavigator.java','auto/CarAppsStore.java','auto/PhoneRotationGuard.java','auto/ParkedCar.java']
          for name in names:
              src=root/name
              assert src.is_file(), f'Missing: {src}'
              dest=Path('fermata/src/main/java/me/aap/fermata')/name
              dest.parent.mkdir(parents=True,exist_ok=True)
              assert not dest.exists(), f'Existing source must not be overwritten: {dest}'
              code=src.read_text(errors='replace')
              if name=='auto/CarAppsStore.java':
                  old='public static boolean isSelected(Context context, String str, String str2) {'
                  new='public static boolean isSelected(Context context, String str, String str2) throws org.json.JSONException {'
                  assert old in code, 'Expected JADX method signature not found'
                  code=code.replace(old,new,1)
              if name=='auto/ParkedCar.java':
                  print('PARKEDCAR SOURCE FOR REPAIR:')
                  for i,line in enumerate(code.splitlines()[:105],1):
                      print(f'{i:03}: {line}')
                  code=code.replace('import com.android.tools.r8.RecordTag;', '')
                  code=code.replace('class Spot extends RecordTag', 'class Spot')
                  code=code.replace('OpenOnCarToken$$ExternalSyntheticRecord0.m(this.time, this.accuracy, this.lat, this.lng)', 'java.util.Objects.hash(this.time, this.accuracy, this.lat, this.lng)')
                  code=code.replace('OpenOnCarToken$$ExternalSyntheticRecord0.m($record$getFieldsAsObjects(), Spot.class, "lat;lng;accuracy;time")', '"Spot[lat=" + this.lat + ", lng=" + this.lng + ", accuracy=" + this.accuracy + ", time=" + this.time + "]"')
                  assert 'OpenOnCarToken$$ExternalSyntheticRecord0' not in code
                  assert 'RecordTag' not in code
              dest.write_text(code)
              print('Added test class:',dest, 'bytes:',dest.stat().st_size)
          PY
      - name: Integrate rotation recovery into application startup
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('fermata/src/main/java/me/aap/fermata/FermataApplication.java')
          s=p.read_text()
          marker='\t\tsuper.onCreate();'
          assert s.count(marker)==1, 'Application lifecycle anchor changed'
          s=s.replace(marker, marker+'\n\t\tme.aap.fermata.auto.PhoneRotationGuard.recover(this);',1)
          p.write_text(s)
          print('Integrated PhoneRotationGuard.recover into FermataApplication.onCreate')
          PY
      - name: Configure JDK and Android SDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - name: Compile debug app with candidate
        run: bash gradlew :fermata:assembleAutoDebug -PAPP_ID=com.nexvory --no-daemon --stacktrace
      - name: Save test APK
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: mola-42-rotation-integrated-debug-test
          path: fermata/build/outputs/apk/auto/debug/*.apk
          if-no-files-found: warn
