name: Build Mola AAB
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      NO_GS: 'true'
    steps:
      - name: Fetch source
        uses: actions/checkout@v4
        with:
          repository: moris545454/araba-
          ref: v4.1.10
      - name: Configure Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Configure Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - name: Verify source configuration
        run: |
          grep -n 'applicationIdSuffix' fermata/build.gradle
          grep -n 'VERSION_NAME' gradle.properties || true
      - name: Build debug bundle to verify source
        run: bash gradlew :fermata:bundleAutoDebug -PAPP_ID=com.nexvory --no-daemon
      - name: Upload debug AAB for build verification
        uses: actions/upload-artifact@v4
        with:
          name: mola-debug-aab
          path: fermata/build/outputs/bundle/autoDebug/*.aab
          if-no-files-found: error
